<app-bulk-action-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  dialogClass="scrape-source-add-dialog"
  width="38rem"
  triggerLabel="Add sources"
  triggerIcon="icon icon-plus"
  headingTitle="Add scrape sources"
  actionLabel="Add sources"
  actionIcon="icon icon-check"
  [actionDisabled]="
    !file() && !scrapeSourceTextarea() && !clipboardScrapeSources()
  "
  (openRequested)="openDialog()"
  (cancelRequested)="closeDialog()"
  (actionRequested)="submitScrapeSources()"
  (hidden)="onDialogHide()"
>
  <app-import-dialog-content
    inputTitle="Source URLs"
    inputHint="One URL per line, each pointing to a page or file that lists proxies. Text and CSV files work too."
    optionsTitle="Scraping"
    [textareaValue]="scrapeSourceTextarea()"
    [textareaPlaceholder]="'https://provider.example/proxies\nhttp://example.net/list.txt'"
    textareaLabel="Scrape source URLs"
    [clipboardPresent]="!!clipboardScrapeSources()"
    [filePresent]="file() !== undefined"
    fileAccept=".txt,.csv"
    (textareaValueChange)="onTextareaChange($event)"
    (pasteRequested)="pasteFromClipboard()"
    (clipboardClearRequested)="clearClipboardSources()"
    (fileSelected)="onFileSelected($event)"
    (fileClearRequested)="onFileClear()"
  >
    <dl import-summary>
      <div>
        <dt>Sources</dt>
        <dd>{{ getSourcesCount() }}</dd>
      </div>
      <div>
        <dt>Unique</dt>
        <dd>{{ getUniqueSourcesCount() }}</dd>
      </div>
      <div>
        <dt>Clipboard</dt>
        <dd>{{ clipboardSourcesCount() }}</dd>
      </div>
      <div>
        <dt>File</dt>
        <dd>{{ fileSourcesCount() }}</dd>
      </div>
    </dl>

    <div import-options class="import-options">
      <app-source-fetch-mode
        inputId="import-source-javascript"
        [compact]="true"
        [enabled]="requiresJavaScript()"
        (enabledChange)="requiresJavaScript.set($event)"
      />
      <app-source-auto-tags
        [forImport]="true"
        [compact]="true"
        [tagIds]="selectedAutoTagIds()"
        (tagIdsChange)="selectedAutoTagIds.set($event)"
      />
    </div>
  </app-import-dialog-content>
</app-bulk-action-dialog>

@if (showPopup()) {
  <app-procesing-popup
    [status]="popupStatus()"
    [count]="addedSourceCount()"
    [item]="'scrape sources'"
    (closed)="onPopupClose()"
  ></app-procesing-popup>
}
