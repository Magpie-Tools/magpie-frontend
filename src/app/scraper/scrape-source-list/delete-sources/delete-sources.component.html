<app-bulk-action-dialog
  [visible]="dialogVisible"
  (visibleChange)="dialogVisible = $event"
  dialogClass="delete-sources-dialog"
  triggerLabel="Delete"
  triggerIcon="pi pi-trash"
  triggerStyleClass="p-button-danger"
  [triggerDisabled]="!hasAnySources()"
  headingEyebrow="Permanent action"
  headingTitle="Delete scrape sources"
  headingIcon="pi pi-exclamation-triangle"
  headingTooltip="Delete scrape sources in bulk with an optional filter. This action cannot be undone."
  tone="danger"
  introIcon="pi pi-lock"
  introTitle="Deleted sources cannot be restored"
  introDescription="Existing proxies stay in your inventory. Review the source scope before continuing."
  [selectedCount]="selectedSources.length"
  footerNote="This action cannot be undone."
  actionLabel="Delete sources"
  actionIcon="pi pi-trash"
  [cancelDisabled]="isDeleting"
  [actionDisabled]="isDeleting || (deleteOption === 'selected' && !canDeleteSelected())"
  [actionLoading]="isDeleting"
  (openRequested)="openDialog()"
  (cancelRequested)="closeDialog()"
  (actionRequested)="submitDelete()"
  (hidden)="onDialogHide()"
>
  <section class="dialog-section" aria-labelledby="delete-source-scope-title">
    <div class="section-heading">
      <div>
        <h3 id="delete-source-scope-title">Choose the scope</h3>
        <p>Delete the highlighted sources or every source that matches the optional filters.</p>
      </div>
    </div>
    <app-bulk-scope-selector
      [(scope)]="deleteOption"
      radioName="deleteSourceOption"
      allInputId="deleteAllSources"
      selectedInputId="deleteSelectedSources"
      allTitle="All sources"
      allDescription="Delete every scrape source you own that matches the filters below."
      selectedTitle="Selected sources"
      selectedDescription="Delete only the sources highlighted in the table."
      [selectedDisabled]="!canDeleteSelected()"
      accentColor="#f87171"
    ></app-bulk-scope-selector>
  </section>

  <div [formGroup]="deleteForm">
    <section class="dialog-section delete-card">
      <div class="section-heading section-heading--split">
        <div>
          <h3>Limit the deletion</h3>
          <p>Enable filters to narrow the chosen scope before sources are removed.</p>
        </div>
        <app-checkbox label="Enable filters" formControlName="filter"></app-checkbox>
      </div>

      @if (deleteForm.get('filter')?.value) {
        <app-scrape-source-filter-panel
          class="delete-filter-panel"
          [form]="deleteForm"
          [floating]="false"
          [showHeader]="false"
          (clear)="clearDeleteFilters()"
        ></app-scrape-source-filter-panel>
      } @else {
        <div class="filter-disabled-copy"><i class="pi pi-filter-slash" aria-hidden="true"></i> No additional filters will be applied.</div>
      }
    </section>
  </div>
</app-bulk-action-dialog>
