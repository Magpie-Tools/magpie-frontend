<div class="filter-panel" [ngClass]="{ 'filter-panel--floating': floating }">
  @if (showHeader) {
    <div class="filter-panel__header">
      <div>
        <div class="filter-panel__title">Filters</div>
        <div class="filter-panel__subtitle">
          Narrow sources by protocol and source proxy counts.
        </div>
      </div>
      <div class="filter-panel__actions">
        <button
          class="ui-button-text ui-button-sm"
          (click)="clear.emit()"
          hlmBtn
          type="button"
          variant="ghost"
        >
          Clear
        </button>
        <button
          class="ui-button-success ui-button-sm"
          (click)="apply.emit()"
          hlmBtn
          type="button"
          variant="default"
        >
          Apply
        </button>
      </div>
    </div>

    <div class="filter-panel__divider" aria-hidden="true"></div>
  }

  <form [formGroup]="form" class="filter-panel__body">
    <div class="filter-section">
      <div class="filter-section__title">Protocol</div>
      <div class="filter-protocol-stack">
        <div class="filter-checkbox-row">
          <hlm-checkbox
            inputId="sourceFilterHttp"
            formControlName="http"
            class="filter-checkbox"
          />
          <label for="sourceFilterHttp" class="filter-checkbox-label"
            >HTTP</label
          >
        </div>
        <div class="filter-checkbox-row">
          <hlm-checkbox
            inputId="sourceFilterHttps"
            formControlName="https"
            class="filter-checkbox"
          />
          <label for="sourceFilterHttps" class="filter-checkbox-label"
            >HTTPS</label
          >
        </div>
      </div>
    </div>

    <div class="filter-panel__vertical-divider" aria-hidden="true"></div>

    <div class="filter-section">
      <div class="filter-section__title">Source Counts</div>
      <div class="filter-count-stack">
        <div class="filter-count-row">
          <label for="sourceFilterProxyCount" class="filter-count-label"
            >Proxy Count</label
          >
          <app-select
            formControlName="proxyCountOperator"
            [options]="countOperatorOptions"
            optionLabel="label"
            optionValue="value"
            class="filter-operator-select"
            inputId="sourceFilterProxyCountOperator"
          ></app-select>
          <input
            hlmInput
            type="number"
            id="sourceFilterProxyCount"
            formControlName="proxyCount"
            [min]="0"
            class="filter-count-input w-full bg-gray-800 text-white border-gray-700 theme-focus"
          />
        </div>

        <div class="filter-count-row">
          <label for="sourceFilterAliveCount" class="filter-count-label"
            >Alive Proxy Count</label
          >
          <app-select
            formControlName="aliveCountOperator"
            [options]="countOperatorOptions"
            optionLabel="label"
            optionValue="value"
            class="filter-operator-select"
            inputId="sourceFilterAliveCountOperator"
          ></app-select>
          <input
            hlmInput
            type="number"
            id="sourceFilterAliveCount"
            formControlName="aliveCount"
            [min]="0"
            class="filter-count-input w-full bg-gray-800 text-white border-gray-700 theme-focus"
          />
        </div>
      </div>
    </div>
  </form>
</div>
