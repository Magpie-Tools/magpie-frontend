<app-bulk-action-dialog
  [visible]="dialogVisible"
  (visibleChange)="dialogVisible = $event"
  dialogClass="export-sources-dialog"
  triggerLabel="Export"
  triggerIcon="pi pi-upload"
  triggerStyleClass="p-button-primary"
  [triggerDisabled]="!hasAnySources()"
  headingEyebrow="Download sources"
  headingTitle="Export scrape sources"
  headingIcon="pi pi-upload"
  headingTooltip="Export scrape sources with an optional filter and a custom output format."
  introIcon="pi pi-file-export"
  introTitle="Build an export file"
  introDescription="Choose the source scope and define the fields written to each line."
  [selectedCount]="selectedSources.length"
  footerNote="The export downloads as a plain-text file."
  actionLabel="Export file"
  actionIcon="pi pi-download"
  [cancelDisabled]="isExporting"
  [actionDisabled]="isExporting || exportForm.invalid || (exportOption === 'selected' && !canExportSelected())"
  [actionLoading]="isExporting"
  (openRequested)="openDialog()"
  (cancelRequested)="closeDialog()"
  (actionRequested)="submitExport()"
  (hidden)="onDialogHide()"
>
  <section class="dialog-section" aria-labelledby="export-source-scope-title">
    <div class="section-heading">
      <div>
        <h3 id="export-source-scope-title">Choose the scope</h3>
        <p>Export the current selection or every source available to this workspace.</p>
      </div>
    </div>
    <app-bulk-scope-selector
      [(scope)]="exportOption"
      radioName="exportSourceOption"
      allInputId="exportAllSources"
      selectedInputId="exportSelectedSources"
      allTitle="All sources"
      allDescription="Export every scrape source currently available."
      selectedTitle="Selected sources"
      selectedDescription="Export only the sources highlighted in the table."
      [selectedDisabled]="!canExportSelected()"
    ></app-bulk-scope-selector>
  </section>

  <div [formGroup]="exportForm" class="export-dialog__settings">
    <section class="dialog-section export-card">
      <div class="section-heading section-heading--split">
        <div>
          <h3>Limit the export</h3>
          <p>Enable filters if the chosen scope still contains sources you do not need.</p>
        </div>
        <app-checkbox label="Enable filters" formControlName="filter"></app-checkbox>
      </div>

      @if (exportForm.get('filter')?.value) {
        <app-scrape-source-filter-panel
          class="export-filter-panel"
          [form]="exportForm"
          [floating]="false"
          [showHeader]="false"
          (clear)="clearExportFilters()"
        ></app-scrape-source-filter-panel>
      } @else {
        <div class="filter-disabled-copy"><i class="pi pi-filter-slash" aria-hidden="true"></i> No additional filters will be applied.</div>
      }
    </section>

    <app-export-format-builder
      [form]="exportForm"
      [fields]="predefinedFilters"
      inputId="sourceOutputFormat"
    ></app-export-format-builder>
  </div>
</app-bulk-action-dialog>
