<div class="filter-panel" [ngClass]="{ 'filter-panel--floating': floating }">
  @if (showHeader) {
    <div class="filter-panel__header">
      <div>
        <div class="filter-panel__title">Filters</div>
        <div class="filter-panel__subtitle">
          Narrow the list by status, protocol health, or metadata.
        </div>
      </div>
      <div class="filter-panel__actions">
        <button
          class="ui-button-text ui-button-sm"
          (click)="clear.emit()"
          hlmBtn
          type="button"
          variant="ghost"
        >
          Clear
        </button>
        <button
          class="ui-button-success ui-button-sm"
          (click)="apply.emit()"
          hlmBtn
          type="button"
          variant="default"
        >
          Apply
        </button>
      </div>
    </div>

    <div class="filter-panel__divider" aria-hidden="true"></div>
  }

  <form [formGroup]="form" class="filter-panel__body">
    <div class="filter-panel__body-main">
      <div class="filter-column filter-column--left">
        <div class="filter-section filter-section--top">
          <div class="filter-section__title">Protocol Alive</div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="flex items-center justify-center">
              <div class="filter-checkbox-row">
                <hlm-checkbox
                  inputId="protocolHttp"
                  formControlName="http"
                  class="filter-checkbox"
                />
                <label for="protocolHttp" class="filter-checkbox-label"
                  >HTTP</label
                >
              </div>
            </div>
            <div class="flex items-center justify-center">
              <div class="filter-checkbox-row">
                <hlm-checkbox
                  inputId="protocolHttps"
                  formControlName="https"
                  class="filter-checkbox"
                />
                <label for="protocolHttps" class="filter-checkbox-label"
                  >HTTPS</label
                >
              </div>
            </div>
            <div class="flex items-center justify-center">
              <div class="filter-checkbox-row">
                <hlm-checkbox
                  inputId="protocolSocks4"
                  formControlName="socks4"
                  class="filter-checkbox"
                />
                <label for="protocolSocks4" class="filter-checkbox-label"
                  >SOCKS4</label
                >
              </div>
            </div>
            <div class="flex items-center justify-center">
              <div class="filter-checkbox-row">
                <hlm-checkbox
                  inputId="protocolSocks5"
                  formControlName="socks5"
                  class="filter-checkbox"
                />
                <label for="protocolSocks5" class="filter-checkbox-label"
                  >SOCKS5</label
                >
              </div>
            </div>
          </div>
        </div>

        <div class="filter-grid mt-2.5">
          <div>
            <label for="filterTimeout" class="filter-label"
              >Max Timeout (ms)</label
            >
            <input
              hlmInput
              type="number"
              id="filterTimeout"
              formControlName="maxTimeout"
              [min]="0"
              class="w-full bg-gray-800 text-white border-gray-700 theme-focus"
            />
          </div>
          <div>
            <label for="filterRetries" class="filter-label">Max Retries</label>
            <input
              hlmInput
              type="number"
              id="filterRetries"
              formControlName="maxRetries"
              [min]="0"
              class="w-full bg-gray-800 text-white border-gray-700 theme-focus"
            />
          </div>
        </div>

        <div class="filter-grid">
          <div>
            <label for="filterCountries" class="filter-label">Country</label>
            <app-select
              [multiple]="true"
              formControlName="countries"
              [options]="countryOptions"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              class="w-full"
              [filter]="true"
              placeholder="Select countries"
              inputId="filterCountries"
            ></app-select>
          </div>
          <div>
            <label for="filterTypes" class="filter-label">Type</label>
            <app-select
              [multiple]="true"
              formControlName="types"
              [options]="typeOptions"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              class="w-full"
              [filter]="true"
              placeholder="Select proxy types"
              inputId="filterTypes"
            ></app-select>
          </div>
        </div>
        <div>
          <label for="filterState" class="filter-label">Lifecycle state</label>
          <app-select
            formControlName="states"
            [multiple]="true"
            [showClear]="true"
            placeholder="All states"
            [options]="proxyStateOptions"
            optionLabel="label"
            optionValue="value"
            class="w-full"
            inputId="filterState"
          ></app-select>
        </div>
      </div>

      <div class="filter-column filter-column--right">
        <div class="filter-grid">
          <div>
            <label for="filterStatus" class="filter-label"
              >Overall Status</label
            >
            <app-select
              formControlName="proxyStatus"
              [options]="proxyStatusOptions"
              optionLabel="label"
              optionValue="value"
              class="w-full"
              inputId="filterStatus"
            ></app-select>
          </div>

          <div>
            <label for="filterReputation" class="filter-label"
              >Reputation</label
            >
            <app-select
              [multiple]="true"
              formControlName="reputationLabels"
              [options]="proxyReputationOptions"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              class="w-full"
              [filter]="true"
              placeholder="Select reputation labels"
              inputId="filterReputation"
            ></app-select>
          </div>
        </div>

        <div class="filter-grid">
          <div>
            <label for="filterAnonymity" class="filter-label">Anonymity</label>
            <app-select
              [multiple]="true"
              formControlName="anonymityLevels"
              [options]="anonymityOptions"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              class="w-full"
              [filter]="true"
              placeholder="Select anonymity levels"
              inputId="filterAnonymity"
            ></app-select>
          </div>
          <div>
            <label for="filterTags" class="filter-label">Tags</label>
            <app-select
              [multiple]="true"
              formControlName="tagIds"
              [options]="tagOptions"
              optionLabel="name"
              optionValue="id"
              [showClear]="true"
              class="w-full"
              [filter]="true"
              placeholder="Select tags"
              inputId="filterTags"
            ></app-select>
          </div>
        </div>
      </div>
    </div>

    <div class="filter-health">
      <div
        class="filter-health__content"
        [ngClass]="{ 'filter-health__content--open': healthFiltersExpanded() }"
      >
        <div class="filter-health__inner">
          <div class="filter-health-grid">
            <div>
              <label for="filterMinHealthOverall" class="filter-label"
                >Overall Health</label
              >
              <input
                hlmInput
                type="number"
                id="filterMinHealthOverall"
                formControlName="minHealthOverall"
                [min]="0"
                [max]="100"
                class="w-full bg-gray-800 text-white border-gray-700 theme-focus"
              />
            </div>
            <div>
              <label for="filterMinHealthHttp" class="filter-label"
                >HTTP Health</label
              >
              <input
                hlmInput
                type="number"
                id="filterMinHealthHttp"
                formControlName="minHealthHttp"
                [min]="0"
                [max]="100"
                class="w-full bg-gray-800 text-white border-gray-700 theme-focus"
              />
            </div>
            <div>
              <label for="filterMinHealthHttps" class="filter-label"
                >HTTPS Health</label
              >
              <input
                hlmInput
                type="number"
                id="filterMinHealthHttps"
                formControlName="minHealthHttps"
                [min]="0"
                [max]="100"
                class="w-full bg-gray-800 text-white border-gray-700 theme-focus"
              />
            </div>
            <div>
              <label for="filterMinHealthSocks4" class="filter-label"
                >SOCKS4 Health</label
              >
              <input
                hlmInput
                type="number"
                id="filterMinHealthSocks4"
                formControlName="minHealthSocks4"
                [min]="0"
                [max]="100"
                class="w-full bg-gray-800 text-white border-gray-700 theme-focus"
              />
            </div>
            <div>
              <label for="filterMinHealthSocks5" class="filter-label"
                >SOCKS5 Health</label
              >
              <input
                hlmInput
                type="number"
                id="filterMinHealthSocks5"
                formControlName="minHealthSocks5"
                [min]="0"
                [max]="100"
                class="w-full bg-gray-800 text-white border-gray-700 theme-focus"
              />
            </div>
          </div>
        </div>
      </div>

      <button
        type="button"
        class="filter-health__toggle"
        [attr.aria-expanded]="healthFiltersExpanded()"
        (click)="toggleHealthFilters()"
      >
        <span class="filter-health__toggle-label">
          More Filters
          @if (activeHealthFilterCount() > 0) {
            <span class="filter-health__toggle-count"
              >({{ activeHealthFilterCount() }})</span
            >
          }
        </span>
        <i
          class="icon icon-chevron-down filter-health__toggle-icon"
          [ngClass]="{
            'filter-health__toggle-icon--open': healthFiltersExpanded(),
          }"
          aria-hidden="true"
        ></i>
      </button>
    </div>
  </form>
</div>
