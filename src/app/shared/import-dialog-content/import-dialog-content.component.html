<section class="form-step" aria-labelledby="import-input-title">
  <header class="form-step__heading">
    <h3 id="import-input-title">{{ inputTitle }}</h3>
    <div class="form-step__action source-actions">
      <div class="source-action">
        <button
          type="button"
          class="button button--quiet button--compact"
          [disabled]="clipboardPresent"
          (click)="pasteRequested.emit()"
        >
          <i class="icon icon-clipboard" aria-hidden="true"></i>Paste
        </button>
        @if (clipboardPresent) {
          <button
            type="button"
            class="source-clear"
            aria-label="Clear clipboard data"
            title="Clear clipboard data"
            (click)="clipboardClearRequested.emit()"
          >
            <i class="icon icon-x" aria-hidden="true"></i>
          </button>
        }
      </div>

      <div class="source-action">
        <button
          type="button"
          class="button button--quiet button--compact"
          [disabled]="filePresent"
          (click)="fileInput.click()"
        >
          <i class="icon icon-file-input" aria-hidden="true"></i>Import file
        </button>
        <input
          type="file"
          #fileInput
          [accept]="fileAccept"
          (change)="fileSelected.emit($event)"
        />
        @if (filePresent) {
          <button
            type="button"
            class="source-clear"
            aria-label="Clear imported file"
            title="Clear imported file"
            (click)="fileClearRequested.emit()"
          >
            <i class="icon icon-x" aria-hidden="true"></i>
          </button>
        }
      </div>
    </div>
  </header>

  <textarea
    class="import-textarea"
    maxlength="109999"
    [placeholder]="textareaPlaceholder"
    [ngModel]="textareaValue"
    (ngModelChange)="textareaValueChange.emit($event)"
    [attr.aria-label]="textareaLabel"
    aria-describedby="import-input-hint"
  ></textarea>
  <p id="import-input-hint" class="field-hint">{{ inputHint }}</p>

  <div class="import-stats" aria-live="polite">
    <ng-content select="[import-summary]"></ng-content>
  </div>
</section>

<section class="form-step" aria-labelledby="import-options-title">
  <header class="form-step__heading">
    <h3 id="import-options-title">{{ optionsTitle }}</h3>
    @if (optionsOptional) {
      <span class="optional-label">Optional</span>
    }
  </header>
  <ng-content select="[import-options]"></ng-content>
</section>
