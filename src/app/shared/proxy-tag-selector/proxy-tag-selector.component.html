<hlm-popover #tagPopover="brnPopover">
  <button
    type="button"
    class="proxy-tag-selector"
    [class.proxy-tag-selector--compact]="compact"
    [class.proxy-tag-selector--empty]="displayTags().length === 0"
    [disabled]="disabled || saving"
    [attr.aria-label]="
      displayTags().length ? 'Edit proxy tags' : 'Add proxy tags'
    "
    hlmPopoverTrigger
    (click)="open($event)"
  >
    @if (saving) {
      <i class="icon icon-spin icon-loader-circle" aria-hidden="true"></i>
    } @else if (displayTags().length === 0) {
      <i class="icon icon-plus" aria-hidden="true"></i>
      <span>Add tags</span>
    } @else {
      <span class="proxy-tag-selector__chips">
        @for (tag of visibleTags(); track tag.id) {
          <span class="proxy-tag-chip" [style.--proxy-tag-color]="tag.color">
            <span class="proxy-tag-chip__name">{{ tag.name }}</span>
          </span>
        }
        @if (hiddenTagCount() > 0) {
          <span class="proxy-tag-selector__more">+{{ hiddenTagCount() }}</span>
        }
      </span>
      <i
        class="icon icon-pencil proxy-tag-selector__edit"
        aria-hidden="true"
      ></i>
    }
  </button>

  <hlm-popover-content *hlmPopoverPortal class="proxy-tag-popover">
    <div class="proxy-tag-menu" (click)="$event.stopPropagation()">
      <div class="proxy-tag-menu__header">
        <div>
          <div class="proxy-tag-menu__title">Proxy tags</div>
          <div class="proxy-tag-menu__subtitle">
            A proxy can use several tags.
          </div>
        </div>
        @if (draftTagIds.length > 0) {
          <button
            type="button"
            class="proxy-tag-menu__text-button"
            (click)="clear()"
          >
            Clear
          </button>
        }
      </div>

      <div class="proxy-tag-menu__list">
        @if (availableTags.length === 0) {
          <div class="proxy-tag-menu__empty">
            <i class="icon icon-tags" aria-hidden="true"></i>
            <span>Create a tag to classify this proxy.</span>
          </div>
        } @else {
          @for (tag of availableTags; track tag.id) {
            <label
              class="proxy-tag-menu__option"
              [attr.for]="inputPrefix + '-' + tag.id"
            >
              <input
                type="checkbox"
                [id]="inputPrefix + '-' + tag.id"
                [checked]="isSelected(tag.id)"
                (change)="toggleTag(tag.id, $any($event.target).checked)"
              />
              <span
                class="proxy-tag-menu__color"
                [style.background-color]="tag.color"
                aria-hidden="true"
              ></span>
              <span>{{ tag.name }}</span>
            </label>
          }
        }
      </div>

      <div class="proxy-tag-menu__footer">
        <button
          type="button"
          class="proxy-tag-menu__manage"
          (click)="openManager(tagPopover)"
        >
          <i class="icon icon-settings" aria-hidden="true"></i>
          Manage tags
        </button>
        <button
          type="button"
          class="proxy-tag-menu__apply"
          (click)="apply(tagPopover)"
        >
          Apply
        </button>
      </div>
    </div>
  </hlm-popover-content>
</hlm-popover>
