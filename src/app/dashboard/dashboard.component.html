<main class="dashboard-page">
  <section class="dashboard-stage">
    <header class="dashboard-context">
      <div class="dashboard-context__identity">
        <span class="dashboard-context__icon"
          ><i class="icon icon-chart-no-axes-combined" aria-hidden="true"></i
        ></span>
        <div class="dashboard-context__copy">
          <h1>Dashboard</h1>
        </div>
      </div>
    </header>

    @if (dashboardInfo().loading && !dashboardInfo().loaded) {
      <div
        class="dashboard-grid dashboard-skeleton"
        aria-label="Loading dashboard"
      >
        @for (card of kpiSkeletons; track $index) {
          <section
            class="dashboard-skeleton-card dashboard-skeleton-card--metric"
          >
            <div class="skeleton-line">
              <hlm-skeleton
                [style.width]="'2.4rem'"
                [style.height]="'2.4rem'"
                [style.border-radius]="'0.75rem'"
              />
              <hlm-skeleton [style.width]="'7rem'" [style.height]="'0.75rem'" />
            </div>
            <hlm-skeleton [style.width]="'8rem'" [style.height]="'2.2rem'" />
            <hlm-skeleton [style.width]="'100%'" [style.height]="'3.6rem'" />
          </section>
        }

        <section class="dashboard-skeleton-card dashboard-skeleton-card--wide">
          <hlm-skeleton [style.width]="'12rem'" [style.height]="'1rem'" />
          <hlm-skeleton [style.width]="'100%'" [style.height]="'22rem'" />
        </section>
        <section
          class="dashboard-skeleton-card dashboard-skeleton-card--narrow"
        >
          <hlm-skeleton [style.width]="'9rem'" [style.height]="'1rem'" />
          <div class="dashboard-skeleton-list">
            @for (row of historySkeletons; track $index) {
              <hlm-skeleton [style.width]="'100%'" [style.height]="'2.6rem'" />
            }
          </div>
        </section>
        <section
          class="dashboard-skeleton-card dashboard-skeleton-card--country"
        >
          <hlm-skeleton [style.width]="'11rem'" [style.height]="'1rem'" />
          <hlm-skeleton [style.width]="'100%'" [style.height]="'19rem'" />
        </section>
        <section class="dashboard-skeleton-card dashboard-skeleton-card--judge">
          <hlm-skeleton [style.width]="'10rem'" [style.height]="'1rem'" />
          <div class="dashboard-skeleton-list">
            @for (row of countrySkeletons; track $index) {
              <hlm-skeleton [style.width]="'100%'" [style.height]="'2rem'" />
            }
          </div>
        </section>
      </div>
    }

    @if (dashboardInfo().error) {
      <app-page-load-error
        [title]="
          dashboardInfo().backendUnavailable
            ? 'Backend unavailable'
            : 'Dashboard could not be loaded'
        "
        [message]="
          dashboardInfo().backendUnavailable
            ? 'Dashboard data cannot load while the API is unreachable.'
            : dashboardInfo().error || ''
        "
        (retry)="retryDashboardLoad()"
      />
    }

    @if (dashboardInfo().loaded) {
      <div class="dashboard-grid">
        <app-kpi-card
          class="dashboard-grid__kpi"
          title="Alive proxies"
          icon="icon icon-bolt"
          [value]="conversionRate().value"
          [displayValue]="conversionRate().value | number"
          [chartValues]="conversionRate().history"
        >
        </app-kpi-card>

        <app-kpi-card
          class="dashboard-grid__kpi"
          title="Total proxies"
          icon="icon icon-server"
          [value]="avgOrderValue().value"
          [displayValue]="avgOrderValue().value | number"
          [chartValues]="avgOrderValue().history"
        >
        </app-kpi-card>

        <app-kpi-card
          class="dashboard-grid__kpi"
          title="Scraped proxies"
          icon="icon icon-download"
          [value]="orderQuantity().value"
          [displayValue]="orderQuantity().value | number"
          [chartValues]="orderQuantity().history"
        >
        </app-kpi-card>

        <app-proxies-per-hour-card
          class="dashboard-grid__throughput"
          [title]="proxiesPerHourTitle"
          [chartData]="proxiesLineData()"
          [chartOptions]="proxiesLineOptions()"
        >
        </app-proxies-per-hour-card>

        <app-proxy-history-card
          class="dashboard-grid__history"
          [history]="proxyHistory()"
          [refreshing]="proxyHistoryRefreshing()"
          (refresh)="onProxyHistoryRefresh()"
        >
        </app-proxy-history-card>

        <app-proxies-per-country-card
          class="dashboard-grid__countries"
          [countries]="majorCountries()"
        >
        </app-proxies-per-country-card>

        <app-judge-by-percentage-card
          class="dashboard-grid__judges"
          [data]="judgeTrafficData()"
        >
        </app-judge-by-percentage-card>

        <app-fastest-alive-proxies-card
          class="dashboard-grid__latency"
          [chartData]="fastestAliveScatterData()"
          [chartOptions]="fastestAliveScatterOptions()"
          [proxyCount]="fastestAliveProxyCount()"
          [countryLegend]="fastestAliveCountryLegend()"
          [sortDirection]="fastestAliveSortDirection()"
          (sortDirectionChange)="onFastestAliveSortDirectionChange($event)"
        >
        </app-fastest-alive-proxies-card>

        <app-proxy-reputation-card
          class="dashboard-grid__reputation"
          [breakdown]="reputationBreakdown()"
          [chartData]="reputationChartData()"
          [chartOptions]="reputationChartOptions()"
        >
        </app-proxy-reputation-card>
      </div>
    }
  </section>
</main>
