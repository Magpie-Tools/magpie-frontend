<section hlmCard [class]="styleClass">
  <div hlmCardHeader>
    <div class="dashboard-card__header">
      <div class="dashboard-card__heading">
        <span class="dashboard-card__icon"
          ><i class="icon icon-activity" aria-hidden="true"></i
        ></span>
        <div class="dashboard-card__copy">
          <h2 class="dashboard-card__title">{{ title }}</h2>
          <p class="dashboard-card__subtitle">Active proxies (not paused or archived), recorded hourly.</p>
        </div>
      </div>
      @if (range) {
        <span class="chart-state"
          ><span aria-hidden="true"></span>{{ range }}</span
        >
      }
    </div>
  </div>
  <div class="dashboard-card__body throughput-card__body">
    <app-chart [definition]="chart" [label]="title" [summary]="summary" />
  </div>
  <!-- A legend only helps when the proxy limit adds a second series. -->
  @if (legend.length > 1) {
    <div class="inventory-legend" aria-label="Inventory chart legend">
      @for (entry of legend; track entry.label) {
        <span><i [style.border-color]="entry.color" [class.is-dashed]="entry.dashed" aria-hidden="true"></i>{{ entry.label }}</span>
      }
    </div>
  }
</section>
