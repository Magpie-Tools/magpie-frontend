<p-card [class]="styleClass">
  <div class="metric-card__topline">
    <div class="metric-card__heading">
      <span class="dashboard-card__icon"><i [class]="icon" aria-hidden="true"></i></span>
      <span>{{ title }}</span>
    </div>
    <p-chip class="metric-card__trend" [ngClass]="getChipClass(resolvedChange)">
      <i class="pi" [ngClass]="getChangeIcon(resolvedChange)" aria-hidden="true"></i>
      {{ formatChange(resolvedChange) }}
    </p-chip>
  </div>

  <strong class="metric-card__value">{{ displayValue ?? value }}</strong>

  <div class="metric-card__visual">
    <p-chart
      type="line"
      [data]="sparklineData"
      [options]="sparklineOptions"
      [ngClass]="getChangeColorClass(resolvedChange)">
    </p-chart>
  </div>
</p-card>
