<section hlmCard [class]="styleClass">
  <div class="dashboard-card__body">
    <div class="metric-card__topline">
      <div class="metric-card__heading">
        <span class="dashboard-card__icon"
          ><i [class]="icon" aria-hidden="true"></i
        ></span>
        <span>{{ title }}</span>
      </div>
      @if (resolvedChange !== null) {
        <span
          hlmBadge
          class="metric-card__trend"
          [ngClass]="getChipClass(resolvedChange)"
        >
          <i
            class="icon"
            [ngClass]="getChangeIcon(resolvedChange)"
            aria-hidden="true"
          ></i>
          {{ formatChange(resolvedChange) }}
        </span>
      }
    </div>

    <strong class="metric-card__value">{{ displayValue ?? value }}</strong>

    @if (sparklinePoints.length > 1) {
      <div class="metric-card__visual">
        <app-chart
          [definition]="sparklineChart"
          [label]="title + ' trend'"
          [ngClass]="getChangeColorClass(resolvedChange ?? 0)"
        />
      </div>
    }
  </div>
</section>
