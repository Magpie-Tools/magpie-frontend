@if (autoLoginChecking()) {
  <div class="app-loading-screen">
    <app-loading></app-loading>
  </div>
} @else {
  <app-auth title="Login">
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onLogin()"
      class="flex flex-col gap-4"
    >
      <!-- Email -->
      <div class="flex flex-col gap-1">
        <label for="email">Email</label>
        <input id="email" type="email" hlmInput formControlName="email" />
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          hlmInput
          formControlName="password"
        />
      </div>

      <!-- Remember login -->
      <div class="auth-options-row">
        <div class="flex items-center gap-2">
          <hlm-checkbox
            inputId="remember"
            [(ngModel)]="rememberPass"
            [ngModelOptions]="{ standalone: true }"
          />
          <label for="remember">Remember login</label>
        </div>
        <a routerLink="/forgot-password" class="auth-inline-link"
          >Forgot password?</a
        >
      </div>

      <button type="submit" class="w-full" hlmBtn variant="default">
        Login
      </button>

      <p class="switch-link text-center mt-2">
        Don't have an account?
        <a routerLink="/register" class="text-blue-500 hover:underline"
          >Register</a
        >
      </p>
    </form>
  </app-auth>
}
