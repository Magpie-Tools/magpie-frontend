@if (autoLoginChecking()) {
  <div class="app-loading-screen">
    <app-loading></app-loading>
  </div>
} @else {
  <app-auth title="Sign in">
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onLogin()"
      class="flex flex-col gap-4"
      novalidate
    >
      <!-- Email -->
      <div class="flex flex-col gap-1">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          hlmInput
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="showError('email') ? 'true' : null"
          [attr.aria-describedby]="showError('email') ? 'email-error' : null"
        />
        @if (showError('email')) {
          <p id="email-error" class="field-error">{{ errorMessage('email') }}</p>
        }
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          hlmInput
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="showError('password') ? 'true' : null"
          [attr.aria-describedby]="showError('password') ? 'password-error' : null"
        />
        @if (showError('password')) {
          <p id="password-error" class="field-error">{{ errorMessage('password') }}</p>
        }
      </div>

      <!-- Remember login -->
      <div class="auth-options-row">
        <div class="flex items-center gap-2">
          <hlm-checkbox
            inputId="remember"
            [(ngModel)]="rememberPass"
            [ngModelOptions]="{ standalone: true }"
          />
          <label for="remember">Remember login</label>
        </div>
        <a routerLink="/forgot-password" class="auth-inline-link"
          >Forgot password?</a
        >
      </div>

      @if (submitError(); as error) {
        <p class="auth-form-error" role="alert">
          <i class="icon icon-circle-alert" aria-hidden="true"></i>
          <span>{{ error }}</span>
        </p>
      }

      <button
        type="submit"
        class="w-full"
        hlmBtn
        variant="default"
        [disabled]="submitting()"
        [attr.aria-busy]="submitting()"
      >
        @if (submitting()) {
          <i class="icon icon-loader-circle icon-spin" aria-hidden="true"></i>
          Signing in…
        } @else {
          Sign in
        }
      </button>

      <p class="switch-link text-center mt-2">
        Don't have an account?
        <a routerLink="/register" class="auth-inline-link"
          >Create one</a
        >
      </p>
    </form>
  </app-auth>
}
