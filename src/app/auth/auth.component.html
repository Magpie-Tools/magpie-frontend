<div class="auth-shell background-color flex items-center justify-center min-h-screen">
  <div class="auth-container flex flex-col items-center">
    <a class="auth-logo flex flex-col items-center mb-6" routerLink="">
      <img [src]="'assets/logo/magpie-light-' + themeService.theme() + '.svg'" alt="Magpie logo" class="mb-2" />
      <h5 class="text-lg font-semibold">M A G P I E</h5>
    </a>

    <p-card class="auth-card w-96">
      <h2 class="text-center mb-4 text-xl font-bold">{{ title }}</h2>
      <ng-content></ng-content>
    </p-card>
  </div>
</div>
