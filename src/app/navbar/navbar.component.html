<nav class="navbar" aria-label="Primary navigation">
  <a class="navbar-brand" routerLink="/" aria-label="Magpie dashboard">
    <span class="navbar-brand__mark">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 512 512" fill="#f9f3f0" aria-hidden="true" focusable="false">
        <g class="navbar-brand__bird">
          <path class="navbar-brand__wing navbar-brand__wing--near" d="M147 42C141 35 130 40 131 50L153 216Q155 230 168 237L253 280Q268 288 280 276L327 231Q333 225 327 219Z"/>
          <path class="navbar-brand__wing navbar-brand__wing--far" d="M312 36C306 29 295 35 298 45L332 159Q336 172 347 180L372 197Q378 201 384 196L404 181Q410 176 405 169Z"/>
          <path d="M42 438Q31 445 38 455Q42 462 51 459L279 366C343 375 393 346 422 302L450 261Q453 256 459 254L493 244Q502 241 493 236L453 216C431 197 409 199 391 217L345 263Z"/>
        </g>
      </svg>
    </span>
    <span class="navbar-brand__copy">
      <strong>Magpie</strong>
    </span>
  </a>

  <div class="nav-scroll">
    <section class="nav-section" aria-labelledby="core-navigation">
      <a
        class="navbar-item"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="navbar-item__icon"
          ><i class="icon icon-chart-no-axes-combined" aria-hidden="true"></i
        ></span>
        <span>Dashboard</span>
      </a>
      <a class="navbar-item" routerLink="/proxies" routerLinkActive="active">
        <span class="navbar-item__icon"
          ><i class="icon icon-server" aria-hidden="true"></i
        ></span>
        <span>Proxies</span>
      </a>
      <a class="navbar-item" routerLink="/scraper" routerLinkActive="active">
        <span class="navbar-item__icon"
          ><i class="icon icon-download" aria-hidden="true"></i
        ></span>
        <span>Scraping</span>
      </a>
      <a class="navbar-item" routerLink="/rotating" routerLinkActive="active">
        <span class="navbar-item__icon"
          ><i class="icon icon-refresh-cw" aria-hidden="true"></i
        ></span>
        <span>Rotating proxies</span>
      </a>
    </section>

    <section class="nav-section" aria-label="Operational alerts">
      <a class="navbar-item" routerLink="/alerts" routerLinkActive="active">
        <span class="navbar-item__icon"><i class="icon icon-bell" aria-hidden="true"></i></span>
        <span>Alerts</span>
      </a>
    </section>

    @for (group of menuItems; track group.label) {
      @if (group.visible !== false) {
        <details class="nav-cluster" [open]="group.expanded === true">
          <summary>
            <span class="nav-cluster__identity">
              <span class="navbar-item__icon"
                ><i [class]="group.icon" aria-hidden="true"></i
              ></span>
              <span>{{ group.label }}</span>
            </span>
            <i
              class="icon icon-chevron-down nav-cluster__chevron"
              aria-hidden="true"
            ></i>
          </summary>

          <div class="nav-cluster__items">
            @for (item of group.items; track item.label) {
              <a
                class="navbar-item navbar-item--nested"
                [routerLink]="item.routerLink"
                routerLinkActive="active"
              >
                <span class="navbar-item__icon"
                  ><i [class]="item.icon" aria-hidden="true"></i
                ></span>
                <span>{{ item.label }}</span>
              </a>
            }
          </div>
        </details>
      }
    }

    <section
      class="nav-section nav-section--workspace"
      aria-labelledby="workspace-navigation"
    >
      <a class="navbar-item" routerLink="/workspace" routerLinkActive="active">
        <span class="navbar-item__icon"
          ><i class="icon icon-building" aria-hidden="true"></i
        ></span>
        <span>Workspace</span>
      </a>
    </section>
  </div>

  <div class="account-section">
    <button
      type="button"
      class="account-trigger"
      [hlmDropdownMenuTrigger]="accountMenu"
      [side]="isMobile() ? 'top' : 'right'"
      [align]="isMobile() ? 'start' : 'end'"
      aria-label="Open account menu"
    >
      <span class="account-avatar"
        ><i class="icon icon-user" aria-hidden="true"></i
      ></span>
      <span class="account-trigger__copy">
        <strong>Account</strong>
        <small [title]="user.email()">{{ user.email() }}</small>
      </span>
      <ng-icon
        name="lucideChevronsUpDown"
        class="account-trigger__more"
        aria-hidden="true"
      ></ng-icon>
    </button>

    <ng-template #accountMenu>
      <hlm-dropdown-menu class="account-menu" aria-label="Account menu">
        <div class="account-menu__identity">
          <span class="account-avatar" aria-hidden="true">
            <i class="icon icon-user"></i>
          </span>
          <div class="account-menu__copy">
            <strong>Account</strong>
            <small [title]="user.email()">{{ user.email() }}</small>
          </div>
        </div>
        <hlm-dropdown-menu-separator />
        <a
          hlmDropdownMenuItem
          class="account-menu__item"
          routerLink="/account"
          routerLinkActive="account-menu__item--active"
          ariaCurrentWhenActive="page"
        >
          <i class="icon icon-badge-check" aria-hidden="true"></i>
          Account
        </a>
        <a
          hlmDropdownMenuItem
          class="account-menu__item"
          routerLink="/workspace"
          routerLinkActive="account-menu__item--active"
          ariaCurrentWhenActive="page"
        >
          <i class="icon icon-building" aria-hidden="true"></i>
          Workspace
        </a>
        <a
          hlmDropdownMenuItem
          class="account-menu__item"
          routerLink="/notifications"
          routerLinkActive="account-menu__item--active"
          ariaCurrentWhenActive="page"
        >
          <i class="icon icon-tag" aria-hidden="true"></i>
          Releases
        </a>
        <hlm-dropdown-menu-separator />
        <button
          hlmDropdownMenuItem
          type="button"
          class="account-menu__item account-menu__item--danger"
          (triggered)="user.logoutAndRedirect()"
        >
          <i class="icon icon-log-out" aria-hidden="true"></i>
          Sign out
        </button>
      </hlm-dropdown-menu>
    </ng-template>
  </div>
</nav>
