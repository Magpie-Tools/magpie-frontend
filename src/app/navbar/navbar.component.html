<nav class="navbar" aria-label="Primary navigation">
  <a class="navbar-brand" routerLink="/" aria-label="Magpie dashboard">
    <span class="navbar-brand__mark">
      <img [src]="getSrcPath()" alt="" />
    </span>
    <span class="navbar-brand__copy">
      <strong>Magpie</strong>
    </span>
  </a>

  <div class="nav-scroll">
    <section class="nav-section" aria-labelledby="core-navigation">
      <a class="navbar-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="navbar-item__icon"><i class="pi pi-chart-line" aria-hidden="true"></i></span>
        <span>Dashboard</span>
      </a>
      <a class="navbar-item" routerLink="/proxies" routerLinkActive="active">
        <span class="navbar-item__icon"><i class="pi pi-server" aria-hidden="true"></i></span>
        <span>Proxies</span>
      </a>
      <a class="navbar-item" routerLink="/scraper" routerLinkActive="active">
        <span class="navbar-item__icon"><i class="pi pi-download" aria-hidden="true"></i></span>
        <span>Scraping</span>
      </a>
      <a class="navbar-item" routerLink="/rotating" routerLinkActive="active">
        <span class="navbar-item__icon"><i class="pi pi-sync" aria-hidden="true"></i></span>
        <span>Rotating proxies</span>
      </a>
    </section>

    @for (group of menuItems; track group.label) {
      @if (group.visible !== false) {
        <details class="nav-cluster" [open]="group.expanded === true">
          <summary>
            <span class="nav-cluster__identity">
              <span class="navbar-item__icon"><i [class]="group.icon" aria-hidden="true"></i></span>
              <span>{{ group.label }}</span>
            </span>
            <i class="pi pi-chevron-down nav-cluster__chevron" aria-hidden="true"></i>
          </summary>

          <div class="nav-cluster__items">
            @for (item of group.items; track item.label) {
              <a class="navbar-item navbar-item--nested"
                 [routerLink]="item.routerLink"
                 routerLinkActive="active">
                <span class="navbar-item__icon"><i [class]="item.icon" aria-hidden="true"></i></span>
                <span>{{ item.label }}</span>
              </a>
            }
          </div>
        </details>
      }
    }

    <section class="nav-section nav-section--workspace" aria-labelledby="workspace-navigation">

      <a class="navbar-item" routerLink="/workspace" routerLinkActive="active">
        <span class="navbar-item__icon"><i class="pi pi-building" aria-hidden="true"></i></span>
        <span>Workspace</span>
      </a>
      <a class="navbar-item" routerLink="/notifications" routerLinkActive="active">
        <span class="navbar-item__icon"><i class="pi pi-bell" aria-hidden="true"></i></span>
        <span>Notifications</span>
      </a>
    </section>
  </div>

  <div class="account-section">
    <button type="button" class="account-trigger" (click)="accountPopover.toggle($event)" aria-label="Open account menu">
      <span class="account-trigger__avatar"><i class="pi pi-user" aria-hidden="true"></i></span>
      <span class="account-trigger__copy">
        <strong>Account</strong>
        <small>Settings and security</small>
      </span>
      <i class="pi pi-ellipsis-h account-trigger__more" aria-hidden="true"></i>
    </button>

    <p-popover #accountPopover styleClass="navbar-account-popover">
      <div class="account-menu">
        <a class="account-menu__item" routerLink="/account" (click)="accountPopover.hide()">
          <i class="pi pi-cog" aria-hidden="true"></i>
          <span><strong>Account settings</strong><small>Theme, password, and security</small></span>
        </a>
        <button type="button" class="account-menu__item account-menu__item--danger" (click)="user.logoutAndRedirect()">
          <i class="pi pi-sign-out" aria-hidden="true"></i>
          <span><strong>Sign out</strong><small>End this session</small></span>
        </button>
      </div>
    </p-popover>
  </div>
</nav>
