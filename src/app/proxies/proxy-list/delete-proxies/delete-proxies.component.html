<app-bulk-action-dialog
  [visible]="dialogVisible"
  (visibleChange)="dialogVisible = $event"
  dialogClass="delete-proxies-dialog"
  triggerLabel="Delete"
  triggerIcon="pi pi-trash"
  triggerStyleClass="p-button-danger"
  [triggerDisabled]="!hasAnyProxies()"
  headingEyebrow="Permanent action"
  headingTitle="Delete proxies"
  headingIcon="pi pi-exclamation-triangle"
  headingTooltip="Delete proxies in bulk with optional filters and status selections. This action cannot be undone."
  tone="danger"
  introIcon="pi pi-lock"
  introTitle="Deleted routes cannot be restored"
  introDescription="Review the scope before continuing. Filters apply only when they are enabled below."
  [selectedCount]="selectedProxies.length"
  footerNote="This action cannot be undone."
  actionLabel="Delete proxies"
  actionIcon="pi pi-trash"
  [cancelDisabled]="isDeleting"
  [actionDisabled]="isDeleting || (deleteOption === 'selected' && !canDeleteSelected())"
  [actionLoading]="isDeleting"
  (openRequested)="openDialog()"
  (cancelRequested)="closeDialog()"
  (actionRequested)="submitDelete()"
  (hidden)="onDialogHide()"
>
  <section class="dialog-section" aria-labelledby="delete-scope-title">
    <div class="section-heading">
      <div>
        <h3 id="delete-scope-title">Choose the scope</h3>
        <p>Delete the highlighted routes or every route that matches the optional filters.</p>
      </div>
    </div>
    <app-bulk-scope-selector
      [(scope)]="deleteOption"
      radioName="deleteOption"
      allInputId="deleteAll"
      selectedInputId="deleteSelected"
      allTitle="All proxies"
      allDescription="Delete every proxy you own that matches the filters below."
      selectedTitle="Selected proxies"
      selectedDescription="Delete only the routes highlighted in the table."
      [selectedDisabled]="!canDeleteSelected()"
      accentColor="#f87171"
    ></app-bulk-scope-selector>
  </section>

  <div [formGroup]="deleteForm">
    <section class="dialog-section delete-card">
      <div class="section-heading section-heading--split">
        <div>
          <h3>Limit the deletion</h3>
          <p>Enable filters to narrow the chosen scope before proxies are removed.</p>
        </div>
        <app-checkbox label="Enable filters" formControlName="filter"></app-checkbox>
      </div>

      @if (deleteForm.get('filter')?.value) {
        <app-proxy-filter-panel
          class="delete-filter-panel"
          [form]="deleteForm"
          [countryOptions]="countryOptions"
          [typeOptions]="typeOptions"
          [anonymityOptions]="anonymityOptions"
          [proxyStatusOptions]="proxyStatusOptions"
          [proxyReputationOptions]="proxyReputationOptions"
          [tagOptions]="tagOptions"
          [floating]="false"
          [showHeader]="false"
          (clear)="clearDeleteFilters()"
        ></app-proxy-filter-panel>
      } @else {
        <div class="filter-disabled-copy"><i class="pi pi-filter-slash" aria-hidden="true"></i> No additional filters will be applied.</div>
      }
    </section>
  </div>
</app-bulk-action-dialog>
