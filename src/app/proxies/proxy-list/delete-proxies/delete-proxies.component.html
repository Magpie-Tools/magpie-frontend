<app-bulk-action-dialog
  [visible]="dialogVisible"
  (visibleChange)="dialogVisible = $event"
  dialogClass="delete-proxies-dialog"
  triggerLabel="Delete"
  triggerIcon="icon icon-trash"
  triggerStyleClass="ui-button-danger"
  [triggerDisabled]="!hasAnyProxies()"
  headingTitle="Delete proxies"
  width="40rem"
  tone="danger"
  [actionLabel]="actionLabel"
  [confirmLabel]="confirmLabel"
  actionIcon="icon icon-trash"
  [cancelDisabled]="isDeleting"
  [actionDisabled]="
    isDeleting || !deleteOption || (deleteOption === 'selected' && !canDeleteSelected())
  "
  [actionLoading]="isDeleting"
  (openRequested)="openDialog()"
  (cancelRequested)="closeDialog()"
  (actionRequested)="submitDelete()"
  (hidden)="onDialogHide()"
>
  <section class="form-step" aria-labelledby="delete-scope-title">
    <header class="form-step__heading">
      <h3 id="delete-scope-title">Proxies to delete</h3>
    </header>
    <app-bulk-scope-selector
      [(scope)]="deleteOption"
      radioName="deleteOption"
      allInputId="deleteAll"
      selectedInputId="deleteSelected"
      [allTitle]="allScopeTitle"
      allDescription="Delete every proxy in this workspace, or only those matching the filters below."
      [selectedTitle]="'Selected proxies (' + selectedProxies.length + ')'"
      selectedDescription="Delete only the proxies selected in the table."
      [selectedDisabled]="!canDeleteSelected()"
      accentColor="var(--theme-primary-400)"
    ></app-bulk-scope-selector>
  </section>

  <section class="form-step" [formGroup]="deleteForm" aria-labelledby="delete-scope-title-filters">
    <header class="form-step__heading">
      <h3 id="delete-scope-title-filters">Filters</h3>
      <span class="optional-label">Optional</span>
      <app-checkbox
        class="form-step__action"
        label="Enable filters"
        formControlName="filter"
      ></app-checkbox>
    </header>

    @if (deleteForm.get("filter")?.value) {
      <app-proxy-filter-panel
        class="delete-filter-panel"
        [form]="deleteForm"
        [countryOptions]="countryOptions"
        [typeOptions]="typeOptions"
        [anonymityOptions]="anonymityOptions"
        [proxyStatusOptions]="proxyStatusOptions"
        [proxyReputationOptions]="proxyReputationOptions"
        [tagOptions]="tagOptions"
        [floating]="false"
        [showHeader]="false"
        (clear)="clearDeleteFilters()"
      ></app-proxy-filter-panel>
    } @else {
      <p class="field-hint">
        No filters. Everything in the chosen scope is deleted.
      </p>
    }
  </section>
</app-bulk-action-dialog>
