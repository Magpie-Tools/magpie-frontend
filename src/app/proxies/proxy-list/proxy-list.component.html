<div class="proxy-container p-8 min-h-screen text-gray-300">
  <div class="actions-wrapper">
    <section class="proxy-workbench" aria-label="Proxy list controls">
      <div class="proxy-workbench__actions-row">
        <div class="proxy-workbench__context">
          <div class="proxy-workbench__eyebrow">Proxy inventory</div>
          <div class="proxy-workbench__summary">
            @if (selectedProxies().length > 0) {
              {{ selectedProxies().length }} selected
            } @else if (hasLoaded()) {
              {{ totalItems() }} proxies
            } @else {
              Loading proxies…
            }
          </div>
          <div class="proxy-workbench__bulk-actions">
            <app-export-proxies
              [allProxies]="dataSource()"
              [selectedProxies]="selectedProxies()"
            ></app-export-proxies>

            <app-delete-proxies
              [allProxies]="dataSource()"
              [selectedProxies]="selectedProxies()"
              (proxiesDeleted)="onProxiesDeleted()"
            ></app-delete-proxies>
          </div>
        </div>

        <nav class="proxy-workbench__tools" aria-label="Proxy tools">
          <app-proxy-tag-manager
            #tagManager
            (tagsChanged)="onTagCatalogChanged()"
          ></app-proxy-tag-manager>

          <p-button
            label="Refresh"
            icon="pi pi-refresh"
            styleClass="p-button-outlined"
            [disabled]="isLoading()"
            (onClick)="refreshList()"
          ></p-button>

          <div #filterToggleAnchor>
            <p-button
              [label]="filterButtonLabel()"
              icon="pi pi-filter"
              [styleClass]="filterToggleClass()"
              (onClick)="toggleFilterPanel($event)"
            ></p-button>
          </div>

          <div #columnToggleAnchor>
            <p-button
              label="Columns"
              icon="pi pi-table"
              styleClass="p-button-outlined"
              [disabled]="isSavingColumnPreferences()"
              (onClick)="openColumnPanel($event)"
            ></p-button>
          </div>

          <app-add-proxies
            (showAddProxiesMessage)="showAddProxiesMessage.emit($event)"
            (proxiesAdded)="onProxiesAdded()"
          ></app-add-proxies>
        </nav>
      </div>

      <div class="proxy-workbench__search-row">
        <i class="pi pi-search" aria-hidden="true"></i>
        <input
          type="search"
          class="proxy-search-input"
          placeholder="Search by host, port, country, status, reputation, or tag"
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchTermChange($event)"
          aria-label="Search proxies"
        />
        @if (searchTerm()) {
          <button type="button" class="proxy-workbench__clear-search" aria-label="Clear search" (click)="clearSearch()">
            <i class="pi pi-times" aria-hidden="true"></i>
          </button>
        }
        <span class="proxy-workbench__search-hint">Filters apply across all pages</span>
      </div>
    </section>

    @if (filterPanelOpen()) {
      <div #filterPanelRef>
        <app-proxy-filter-panel
          [form]="filterForm"
          [countryOptions]="countryOptions()"
          [typeOptions]="typeOptions()"
          [anonymityOptions]="anonymityOptions()"
          [proxyStatusOptions]="proxyStatusOptions"
          [proxyReputationOptions]="proxyReputationOptions"
          [tagOptions]="tagService.tags()"
          [floating]="true"
          (clear)="clearFilters()"
          (apply)="applyFilters()"
        ></app-proxy-filter-panel>
      </div>
    }

    @if (columnPanelOpen()) {
      <app-column-picker-panel
        #columnPanelRef
        class="column-panel"
        [columns]="columnPickerColumns()"
        [selectedColumnIds]="displayedColumns()"
        [defaultColumnIds]="defaultProxyTableColumns"
        [saving]="isSavingColumnPreferences()"
        (cancel)="closeColumnPanel()"
        (save)="saveColumnPreferences($event)"
        (dragStarted)="onColumnEditorDragStart()"
        (dragEnded)="onColumnEditorDragEnd()"
      ></app-column-picker-panel>
    }
  </div>

  <app-proxy-table
    [proxies]="dataSource()"
    [loading]="isLoading()"
    [hasLoaded]="hasLoaded()"
    [page]="page()"
    [pageSize]="pageSize()"
    [totalRecords]="totalItems()"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [skeletonRows]="skeletonRows"
    [selectionEnabled]="true"
    [selection]="selectedProxies()"
    [selectionModel]="selection"
    [isAllSelected]="isAllSelected()"
    [sortable]="true"
    [sortField]="sortField()"
    [sortOrder]="sortOrder()"
    [checkingProxyIds]="checkingProxyIds()"
    [savingTagProxyIds]="savingTagProxyIds()"
    [availableTags]="tagService.tags()"
    [columns]="proxyTableColumns()"
    pageScrollTargetStorageKey="magpie-proxy-list-page-scroll-target"
    (lazyLoad)="onLazyLoad($event)"
    (selectionChange)="onSelectionChange($event)"
    (masterToggle)="masterToggle()"
    (toggleSelection)="toggleSelection($event)"
    (sort)="onSort($event)"
    (checkNow)="checkProxyNow($event)"
    (viewProxy)="onViewProxy($event)"
    (tagSelectionChange)="onTagSelectionChange($event)"
    (manageTags)="tagManager.open()"
  ></app-proxy-table>
</div>
