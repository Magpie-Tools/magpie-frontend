<app-inventory-page-shell
  pageIcon="pi pi-server"
  pageTitle="Managed proxies"
  pageDescription="Search, inspect, tag, and control every proxy route in the current workspace."
  toolbarTitle="Find the routes you need"
  toolbarDescription="Search every page, narrow the inventory, or adjust the table before taking action."
  toolbarAriaLabel="Proxy tools"
  [searchTerm]="searchTerm()"
  searchPlaceholder="Search host, port, country, status, reputation, or tag"
  searchAriaLabel="Search proxies"
  resultIcon="pi pi-th-large"
  resultTitle="Proxy routes"
  resultDescription="Sort columns, copy addresses, edit tags, and open a route for its full check history."
  [selectedCount]="selectedProxies().length"
  [totalItems]="totalItems()"
  [hasLoaded]="hasLoaded()"
  [loading]="isLoading()"
  loadingLabel="Loading routes"
  [activeFilters]="hasActiveFilters()"
  emptyTitle="No proxy routes yet"
  filteredEmptyTitle="No matching proxy routes"
  emptyDescription="Use Add proxies above to import the first routes into this workspace."
  (searchTermChange)="onSearchTermChange($event)"
  (clearSearch)="clearSearch()"
  (clearFilters)="clearFilters()"
>
  <ng-container inventory-actions>
    <app-proxy-tag-manager
      #tagManager
      class="toolbar-action toolbar-action--tags"
      [showTrigger]="workspaces.canOperate()"
      (tagsChanged)="onTagCatalogChanged()"
    ></app-proxy-tag-manager>

    <button type="button" class="tool-button" [disabled]="isLoading()" (click)="refreshList()">
      <i class="pi" [class.pi-spin]="isLoading()" [class.pi-spinner]="isLoading()" [class.pi-refresh]="!isLoading()" aria-hidden="true"></i>
      Refresh
    </button>

    <div #filterToggleAnchor>
      <button
        type="button"
        class="tool-button"
        [class.is-active]="hasActiveFilters()"
        [attr.aria-expanded]="filterPanelOpen()"
        (click)="toggleFilterPanel($event)"
      >
        <i class="pi pi-filter" aria-hidden="true"></i>
        {{ filterButtonLabel() }}
      </button>
    </div>

    <div #columnToggleAnchor>
      <button
        type="button"
        class="tool-button"
        [class.is-active]="columnPanelOpen()"
        [disabled]="isSavingColumnPreferences()"
        [attr.aria-expanded]="columnPanelOpen()"
        (click)="openColumnPanel($event)"
      >
        <i class="pi pi-table" aria-hidden="true"></i>
        Columns
      </button>
    </div>

    <app-export-proxies
      class="toolbar-action toolbar-action--export"
      [allProxies]="dataSource()"
      [selectedProxies]="selectedProxies()"
    ></app-export-proxies>

    @if (workspaces.canOperate()) {
      <app-delete-proxies
        class="toolbar-action toolbar-action--delete"
        [allProxies]="dataSource()"
        [selectedProxies]="selectedProxies()"
        (proxiesDeleted)="onProxiesDeleted()"
      ></app-delete-proxies>

      <app-add-proxies
        class="toolbar-action toolbar-action--add"
        (proxiesAdded)="onProxiesAdded()"
      ></app-add-proxies>
    }
  </ng-container>

  <ng-container inventory-overlays>
    @if (filterPanelOpen()) {
      <div #filterPanelRef>
        <app-proxy-filter-panel
          [form]="filterForm"
          [countryOptions]="countryOptions()"
          [typeOptions]="typeOptions()"
          [anonymityOptions]="anonymityOptions()"
          [proxyStatusOptions]="proxyStatusOptions"
          [proxyReputationOptions]="proxyReputationOptions"
          [tagOptions]="tagService.tags()"
          [floating]="true"
          (clear)="clearFilters()"
          (apply)="applyFilters()"
        ></app-proxy-filter-panel>
      </div>
    }

    @if (columnPanelOpen()) {
      <app-column-picker-panel
        #columnPanelRef
        class="column-panel"
        [columns]="columnPickerColumns()"
        [selectedColumnIds]="displayedColumns()"
        [defaultColumnIds]="defaultProxyTableColumns"
        [saving]="isSavingColumnPreferences()"
        (cancel)="closeColumnPanel()"
        (save)="saveColumnPreferences($event)"
        (dragStarted)="onColumnEditorDragStart()"
        (dragEnded)="onColumnEditorDragEnd()"
      ></app-column-picker-panel>
    }
  </ng-container>

  <app-proxy-table
    inventory-table
    class="inventory-table"
    [proxies]="dataSource()"
    [loading]="isLoading()"
    [hasLoaded]="hasLoaded()"
    [page]="page()"
    [pageSize]="pageSize()"
    [totalRecords]="totalItems()"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [skeletonRows]="skeletonRows"
    [selectionEnabled]="true"
    [selection]="selectedProxies()"
    [selectionModel]="selection"
    [isAllSelected]="isAllSelected()"
    [sortable]="true"
    [sortField]="sortField()"
    [sortOrder]="sortOrder()"
    [checkingProxyIds]="checkingProxyIds()"
    [savingTagProxyIds]="savingTagProxyIds()"
    [availableTags]="tagService.tags()"
    [tagEditingEnabled]="workspaces.canOperate()"
    [lifecycleEnabled]="workspaces.canOperate()"
    [lifecycleChangingIds]="lifecycleChangingIds()"
    [columns]="proxyTableColumns()"
    pageScrollTargetStorageKey="magpie-proxy-list-page-scroll-target"
    (lazyLoad)="onLazyLoad($event)"
    (selectionChange)="onSelectionChange($event)"
    (masterToggle)="masterToggle()"
    (toggleSelection)="toggleSelection($event)"
    (sort)="onSort($event)"
    (checkNow)="checkProxyNow($event)"
    (viewProxy)="onViewProxy($event)"
    (tagSelectionChange)="onTagSelectionChange($event)"
    (manageTags)="tagManager.open()"
    (lifecycleChange)="onLifecycleChange($event)"
  ></app-proxy-table>
</app-inventory-page-shell>
