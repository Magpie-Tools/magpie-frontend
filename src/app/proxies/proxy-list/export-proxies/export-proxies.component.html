<app-bulk-action-dialog
  [visible]="dialogVisible"
  (visibleChange)="dialogVisible = $event"
  dialogClass="export-proxies-dialog"
  triggerLabel="Export"
  triggerIcon="pi pi-upload"
  triggerStyleClass="p-button-primary"
  [triggerDisabled]="!hasAnyProxies()"
  headingEyebrow="Download routes"
  headingTitle="Export proxies"
  headingIcon="pi pi-upload"
  headingTooltip="Export proxies with optional filters, output formats, and status selections."
  introIcon="pi pi-file-export"
  introTitle="Build an export file"
  introDescription="Choose the route scope and define the exact fields written to each line."
  [selectedCount]="selectedProxies.length"
  footerNote="The export downloads as a plain-text file."
  actionLabel="Export file"
  actionIcon="pi pi-download"
  [cancelDisabled]="isExporting"
  [actionDisabled]="isExporting || exportForm.invalid || (exportOption === 'selected' && !canExportSelected())"
  [actionLoading]="isExporting"
  (openRequested)="openDialog()"
  (cancelRequested)="closeDialog()"
  (actionRequested)="submitExport()"
  (hidden)="onDialogHide()"
>
  <section class="dialog-section" aria-labelledby="export-scope-title">
    <div class="section-heading">
      <div>
        <h3 id="export-scope-title">Choose the scope</h3>
        <p>Export the current selection or all routes available to this workspace.</p>
      </div>
    </div>
    <app-bulk-scope-selector
      [(scope)]="exportOption"
      radioName="exportOption"
      allInputId="exportAll"
      selectedInputId="exportSelected"
      allTitle="All proxies"
      allDescription="Export every proxy currently available."
      selectedTitle="Selected proxies"
      selectedDescription="Export only the routes highlighted in the table."
      [selectedDisabled]="!canExportSelected()"
    ></app-bulk-scope-selector>
  </section>

  <div [formGroup]="exportForm" class="export-dialog__settings">
    <section class="dialog-section export-card">
      <div class="section-heading section-heading--split">
        <div>
          <h3>Limit the export</h3>
          <p>Enable filters if the chosen scope still contains routes you do not need.</p>
        </div>
        <app-checkbox label="Enable filters" formControlName="filter"></app-checkbox>
      </div>

      @if (exportForm.get('filter')?.value) {
        <app-proxy-filter-panel
          class="export-filter-panel"
          [form]="exportForm"
          [countryOptions]="countryOptions"
          [typeOptions]="typeOptions"
          [anonymityOptions]="anonymityOptions"
          [proxyStatusOptions]="proxyStatusOptions"
          [proxyReputationOptions]="proxyReputationOptions"
          [tagOptions]="tagOptions"
          [floating]="false"
          [showHeader]="false"
          (clear)="clearExportFilters()"
        ></app-proxy-filter-panel>
      } @else {
        <div class="filter-disabled-copy"><i class="pi pi-filter-slash" aria-hidden="true"></i> No additional filters will be applied.</div>
      }
    </section>

    <app-export-format-builder
      [form]="exportForm"
      [fields]="predefinedFilters"
      inputId="outputFormat"
    ></app-export-format-builder>
  </div>
</app-bulk-action-dialog>
